            const ref = useRef(null);
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setVisible(true);
                        observer.unobserve(entry.target);
                    }
                }, options);

                if (ref.current) {
                    observer.observe(ref.current);
                }

                return () => {
                    if (ref.current) observer.unobserve(ref.current);
                };
            }, [ref, options]);

            return [ref, visible];
        };

        // --- Particle Animation Component ---
        const CursorParticles = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let mouse = { x: null, y: null };

                const resizeCanvas = () => {
                    canvas.width = canvas.parentElement.offsetWidth;
                    canvas.height = canvas.parentElement.offsetHeight;
                };

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.8; // Increased speed slightly
                        this.vy = (Math.random() - 0.5) * 0.8; // Increased speed slightly
                        this.size = Math.random() * 3 + 2; // Increased size (min 2, max 5)
                        this.color = 'rgba(124, 58, 237, '; // accent-600 base
                    }

                    update() {
                        this.x += this.vx;
                        this.y += this.vy;

                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                        // Mouse interaction
                        if (mouse.x != null) {
                            let dx = mouse.x - this.x;
                            let dy = mouse.y - this.y;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < 150) { // Increased interaction radius
                                const forceDirectionX = dx / distance;
                                const forceDirectionY = dy / distance;
                                const force = (150 - distance) / 150;
                                const directionX = forceDirectionX * force * 0.8; // Increased force
                                const directionY = forceDirectionY * force * 0.8;
                                this.vx += directionX;
                                this.vy += directionY;
                            }
                        }
                    }

                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color + '0.6)'; // Increased opacity from 0.3 to 0.6
                        ctx.fill();
                    }
                }

                const initParticles = () => {
                    particles = [];
                    for (let i = 0; i < 80; i++) { // Increased count from 50 to 80
                        particles.push(new Particle());
                    }
                };

                initParticles();

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                        
                        // Connect particles close to mouse
                        if (mouse.x != null) {
                            let dx = mouse.x - p.x;
                            let dy = mouse.y - p.y;
                            let distance = Math.sqrt(dx*dx + dy*dy);
                            if (distance < 150) { // Increased connection distance
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(124, 58, 237, ${0.5 - distance/300})`; // Increased line opacity
                                ctx.lineWidth = 1.5; // Slightly thicker lines
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(mouse.x, mouse.y);
                                ctx.stroke();
                            }
                        }
                    });
                    
                    animationFrameId = requestAnimationFrame(animate);
                };

                animate();

                const handleMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left;
                    mouse.y = e.clientY - rect.top;
                };

                const handleMouseLeave = () => {
                    mouse.x = null;
                    mouse.y = null;
                };

                canvas.parentElement.addEventListener('mousemove', handleMouseMove);
                canvas.parentElement.addEventListener('mouseleave', handleMouseLeave);

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    canvas.parentElement.removeEventListener('mousemove', handleMouseMove);
                    canvas.parentElement.removeEventListener('mouseleave', handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none" />;
        };
