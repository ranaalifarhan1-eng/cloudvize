<body class="antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Shared Components ---
        const useOnScreen = (options) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); observer.unobserve(entry.target); }
                }, options);
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); };
            }, [ref, options]);
            return [ref, visible];
        };

        const ScrollReveal = ({ children, delay = 0, className = "" }) => {
            const [ref, visible] = useOnScreen({ threshold: 0.1 });
            return (
                <div ref={ref} className={`reveal-hidden ${visible ? 'reveal-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const Icon = ({ path, className, size = 24, strokeWidth = 2 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const ArrowRight = (props) => <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></>} />;
        const Check = (props) => <Icon {...props} path={<><polyline points="20 6 9 17 4 12"></polyline></>} />;
        const ChevronDown = (props) => <Icon {...props} path={<><polyline points="6 9 12 15 18 9"></polyline></>} />;
        const Target = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></>} />;
        const Search = (props) => <Icon {...props} path={<><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>} />;
        const Code = (props) => <Icon {...props} path={<><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></>} />;
        const PenTool = (props) => <Icon {...props} path={<><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></>} />;
        const Mail = (props) => <Icon {...props} path={<><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></>} />;
        const PieChart = (props) => <Icon {...props} path={<><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></>} />;
        const Zap = (props) => <Icon {...props} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></>} />;
        const Layout = (props) => <Icon {...props} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></>} />;
        const Smartphone = (props) => <Icon {...props} path={<><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></>} />;
        const Database = (props) => <Icon {...props} path={<><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></>} />;
        const Star = (props) => <Icon {...props} path={<><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></>} />;
        const MapPin = (props) => <Icon {...props} path={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></>} />;

        // --- Cursor Particles (Reused) ---
        const CursorParticles = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let mouse = { x: null, y: null };

                const resizeCanvas = () => {
                    canvas.width = canvas.parentElement.offsetWidth;
                    canvas.height = canvas.parentElement.offsetHeight;
                };
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.8;
                        this.vy = (Math.random() - 0.5) * 0.8;
                        this.size = Math.random() * 3 + 2;
                        this.color = 'rgba(124, 58, 237, ';
                    }
                    update() {
                        this.x += this.vx; this.y += this.vy;
                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                        if (mouse.x != null) {
                            let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < 150) {
                                const force = (150 - distance) / 150;
                                this.vx += (dx / distance) * force * 0.8;
                                this.vy += (dy / distance) * force * 0.8;
                            }
                        }
                    }
                    draw() {
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color + '0.6)'; ctx.fill();
                    }
                }

                const initParticles = () => { particles = []; for (let i = 0; i < 80; i++) particles.push(new Particle()); };
                initParticles();

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.update(); p.draw();
                        if (mouse.x != null) {
                            let dx = mouse.x - p.x; let dy = mouse.y - p.y;
                            let distance = Math.sqrt(dx*dx + dy*dy);
                            if (distance < 150) {
                                ctx.beginPath(); ctx.strokeStyle = `rgba(124, 58, 237, ${0.5 - distance/300})`;
                                ctx.lineWidth = 1.5; ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                            }
                        }
                    });
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();

                const handleMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
                };
                const handleMouseLeave = () => { mouse.x = null; mouse.y = null; };

                canvas.parentElement.addEventListener('mousemove', handleMouseMove);
                canvas.parentElement.addEventListener('mouseleave', handleMouseLeave);
                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    canvas.parentElement.removeEventListener('mousemove', handleMouseMove);
                    canvas.parentElement.removeEventListener('mouseleave', handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);
            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none" />;
        };

        const ServiceCard = ({ icon: Icon, title, desc, features, color, delay, link }) => (

                    </a>

            </ScrollReveal>
        );

        const DetailedService = ({ title, sub, desc, items, reverse, image }) => (
            <div className={`flex flex-col lg:flex-row gap-16 items-center py-24 ${reverse ? 'lg:flex-row-reverse' : ''}`}>

                    <ScrollReveal>
                        <span className="text-accent-600 font-bold uppercase tracking-widest text-xs bg-accent-50 px-3 py-1 rounded-full">{sub}</span>

        // --- FAQ Item Component ---

                        <div className={`w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300 ${isOpen ? 'bg-accent-600 text-white rotate-180' : 'bg-slate-100 text-slate-400 group-hover:bg-accent-50 group-hover:text-accent-600'}`}>

        const App = () => {

                                                <a key={i} href={item.href} className="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group/item hover:bg-slate-50 text-slate-600 hover:text-accent-600">

                        <div className="container mx-auto px-6 relative z-10 text-center">
                            <ScrollReveal>
                                <div className="inline-flex items-center gap-2 border border-accent-200 bg-accent-50/50 px-5 py-2 rounded-full mb-8 backdrop-blur-md shadow-sm">
                                    <span className="relative flex h-2.5 w-2.5">
