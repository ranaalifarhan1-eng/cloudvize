        const { useState, useEffect, useRef } = React;

        // --- Shared Components ---
        const useOnScreen = (options) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); observer.unobserve(entry.target); }
                }, options);
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); };
            }, [ref, options]);
            return [ref, visible];
        };

        const ScrollReveal = ({ children, delay = 0, className = "" }) => {
            const [ref, visible] = useOnScreen({ threshold: 0.1 });
            return (
                <div ref={ref} className={`reveal-hidden ${visible ? 'reveal-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        // --- Icons ---
        const Icon = ({ path, className, size = 24, strokeWidth = 2 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const ArrowRight = (props) => <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></>} />;
        const ChevronDown = (props) => <Icon {...props} path={<><polyline points="6 9 12 15 18 9"></polyline></>} />;
        const MapPin = (props) => <Icon {...props} path={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></>} />;
        const Mail = (props) => <Icon {...props} path={<><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></>} />;
        const Smartphone = (props) => <Icon {...props} path={<><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></>} />;
        const Send = (props) => <Icon {...props} path={<><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></>} />;

        // --- Cursor Particles (Reused) ---
        const CursorParticles = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let mouse = { x: null, y: null };

                const resizeCanvas = () => {
                    canvas.width = canvas.parentElement.offsetWidth;
                    canvas.height = canvas.parentElement.offsetHeight;
                };
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.8;
                        this.vy = (Math.random() - 0.5) * 0.8;
                        this.size = Math.random() * 3 + 2;
                        this.color = 'rgba(124, 58, 237, ';
                    }
                    update() {
                        this.x += this.vx; this.y += this.vy;
                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                        if (mouse.x != null) {
                            let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < 150) {
                                const force = (150 - distance) / 150;
                                this.vx += (dx / distance) * force * 0.8;
                                this.vy += (dy / distance) * force * 0.8;
                            }
                        }
                    }
                    draw() {
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color + '0.6)'; ctx.fill();
                    }
                }

                const initParticles = () => { particles = []; for (let i = 0; i < 40; i++) particles.push(new Particle()); }; // Reduced count to 40
                initParticles();

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.update(); p.draw();
                        if (mouse.x != null) {
                            let dx = mouse.x - p.x; let dy = mouse.y - p.y;
                            let distance = Math.sqrt(dx*dx + dy*dy);
                            if (distance < 150) {
                                ctx.beginPath(); ctx.strokeStyle = `rgba(124, 58, 237, ${0.5 - distance/300})`;
                                ctx.lineWidth = 1.5; ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                            }
                        }
                    });
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();

                const handleMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
                };
                const handleMouseLeave = () => { mouse.x = null; mouse.y = null; };

                canvas.parentElement.addEventListener('mousemove', handleMouseMove);
                canvas.parentElement.addEventListener('mouseleave', handleMouseLeave);
                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    canvas.parentElement.removeEventListener('mousemove', handleMouseMove);
                    canvas.parentElement.removeEventListener('mouseleave', handleMouseLeave);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);
            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none" />;
        };

                                                        <input

                                                            name="website"
                                                            value={formData.website}
                                                            onChange={handleChange}
                                                            placeholder="www.yourcompany.com" 
                                                            className="w-full px-5 py-4 rounded-xl bg-white border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 outline-none transition-all shadow-sm"
                                                        />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="text-sm font-bold text-slate-700 ml-1">Monthly Ad Budget</label>
                                                        <select 
                                                            name="budget"
                                                            value={formData.budget}
                                                            onChange={handleChange}
                                                            className="w-full px-5 py-4 rounded-xl bg-white border border-slate-200 text-slate-900 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 outline-none transition-all shadow-sm appearance-none cursor-pointer"
                                                        >
                                                            <option value="" disabled>Select a range...</option>
                                                            <option value="Just Starting">Just Starting ($1k - $5k)</option>
                                                            <option value="Scaling">$5k - $20k</option>
                                                            <option value="Growth">$20k - $50k</option>
                                                            <option value="Enterprise">$50k+</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div className="space-y-2">
                                                    <label className="text-sm font-bold text-slate-700 ml-1">How can we help?</label>
                                                    <textarea 
                                                        name="message"
                                                        value={formData.message}
                                                        onChange={handleChange}
                                                        placeholder="Tell us about your challenges and goals..." 
                                                        rows="4" 
                                                        className="w-full px-5 py-4 rounded-xl bg-white border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/10 outline-none transition-all shadow-sm resize-none"
                                                    ></textarea>
                                                </div>

                                                <button type="submit" className="w-full bg-gradient-to-r from-accent-600 to-indigo-600 text-white font-bold text-xl py-5 rounded-xl hover:from-accent-500 hover:to-indigo-500 transition-all shadow-xl shadow-accent-500/30 flex justify-center items-center gap-2 group hover:-translate-y-1">
                                                    Send Inquiry <Send size={20} className="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" />
                                                </button>
                                            </form>
                                        </div>
                                    </ScrollReveal>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer id="footer-form" className="bg-[#0B1120] text-white pt-24 pb-12 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-[600px] bg-accent-900/20 blur-[150px] pointer-events-none"></div>
                        <div className="absolute bottom-0 right-0 w-[500px] h-[500px] bg-blue-900/10 blur-[120px] pointer-events-none"></div>
                        
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="flex flex-col md:flex-row justify-between items-center border-t border-white/10 pt-10">
                                <p className="text-sm text-slate-500">© 2025 CloudVize Agency. All rights reserved.</p>
                                <div className="flex gap-10 mt-6 md:mt-0 text-sm text-slate-500">
                                    <a href="#" className="hover:text-white transition-colors">Privacy Policy</a>
                                    <a href="#" className="hover:text-white transition-colors">Terms of Service</a>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
